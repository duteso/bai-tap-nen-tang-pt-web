<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Todo App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-app">
        <header>
            <h1>todos</h1>
            <form id="todoForm">
                <input type="text" id="todoInput" placeholder="What needs to be done?" autocomplete="off">
                <button type="submit" id="addBtn">Add</button>
            </form>
        </header>
        
        <main>
            <ul id="todoList"></ul>
        </main>
        
        <footer id="todoFooter" class="hidden">
            <span id="todoCount">0 items left</span>
            <ul class="filters" id="filters">
                <li><button class="filter-btn selected" data-filter="all">All</button></li>
                <li><button class="filter-btn" data-filter="active">Active</button></li>
                <li><button class="filter-btn" data-filter="completed">Completed</button></li>
            </ul>
            <button id="clearCompleted">Clear completed</button>
        </footer>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
