<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý Sinh Viên</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Quản lý Sinh Viên</h1>

    <div class="stats">
        <p>Tổng số sinh viên: <span id="totalStudents">0</span></p>
        <p>Điểm trung bình cả lớp: <span id="avgScore">0.0</span></p>
    </div>

    <div class="header-action">
        <button onclick="openModal()">Thêm Sinh Viên</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>Mã SV</th>
                <th>Họ và tên</th>
                <th>Ngày sinh</th>
                <th>Lớp học</th>
                <th>Điểm TB</th>
                <th>Email</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="studentTableBody">
        </tbody>
    </table>

    <div id="studentModal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Thêm Sinh Viên</h2>
            <form id="studentForm">
                <input type="hidden" id="editIndex" value="-1">
                
                <div class="form-group">
                    <label>Mã sinh viên:</label>
                    <input type="text" id="maSV" required>
                </div>
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" id="hoTen" required>
                </div>
                <div class="form-group">
                    <label>Ngày sinh:</label>
                    <input type="date" id="ngaySinh" required>
                </div>
                <div class="form-group">
                    <label>Lớp học:</label>
                    <input type="text" id="lopHoc" required>
                </div>
                <div class="form-group">
                    <label>Điểm trung bình:</label>
                    <input type="number" step="0.1" min="0" max="10" id="diemTB" required>
                </div>
                <div class="form-group">
                    <label>Email:</label>
                    <input type="email" id="email" required>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" onclick="closeModal()">Hủy</button>
                    <button type="submit" id="btnSubmit">Lưu dữ liệu</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
