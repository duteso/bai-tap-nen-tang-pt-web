<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>
    <div class="container">
        <h1>CSS Transitions & Animations Demo</h1>

        <section class="demo-section">
            <h2>1. Card Hover Effect</h2>
            <div class="cards">
                <div class="card">
                    <img src="https://placehold.co/300x200" alt="Product">
                    <h3>Sản phẩm A</h3>
                    <p>Mô tả sản phẩm ngắn gọn</p>
                    <p class="price">499.000đ</p>
                </div>
                <div class="card">
                    <img src="https://placehold.co/300x200" alt="Product">
                    <h3>Sản phẩm B</h3>
                    <p>Mô tả sản phẩm ngắn gọn</p>
                    <p class="price">599.000đ</p>
                </div>
                <div class="card">
                    <img src="https://placehold.co/300x200" alt="Product">
                    <h3>Sản phẩm C</h3>
                    <p>Mô tả sản phẩm ngắn gọn</p>
                    <p class="price">699.000đ</p>
                </div>
            </div>
        </section>

        <section class="demo-section">
            <h2>2. Button Hover</h2>
            <div class="buttons">
                <button class="btn-primary">Mua ngay</button>
                <button class="btn-secondary">Thêm vào giỏ</button>
                <button class="btn-success">Đặt hàng</button>
            </div>
        </section>

        <section class="demo-section">
            <h2>3. Image Zoom</h2>
            <div class="image-zoom-container">
                <img src="https://placehold.co/600x400" alt="Zoom Demo">
            </div>
        </section>

        <section class="demo-section">
            <h2>4. Loading Spinner</h2>
            <div class="spinner"></div>
        </section>

        <section class="demo-section">
            <h2>5. Fade-in Animation</h2>
            <div class="fade-in-boxes">
                <div class="fade-box">Box 1</div>
                <div class="fade-box">Box 2</div>
                <div class="fade-box">Box 3</div>
                <div class="fade-box">Box 4</div>
            </div>
        </section>
    </div>
</body>
</html>
